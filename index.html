<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gerador de QR Code">
    <meta name="keywords" content="QR Code, Gerador de QR Code">
    <meta name="author" content="Maria Eduarda">
    <link rel="shortcut icon" href="https://img.icons8.com/ios-glyphs/30/qr-code--v1.png" type="image/x-icon">
    <link rel="stylesheet" href="./src/css/style.css">
    <title>Gerador QR Code</title>
</head>
<body>
    <header>
        <h1>Gerador de QR Code</h1>
    </header>
    <main>
        <div class="container">
            <p>Insira um texto ou URL para gerar o QR Code</p>
            <input type="text" placeholder="Digite o texto ou URL" id="qr-text">
            <div id="img-box">
                <img src="" alt="" id="qr-img">
            </div>
            <button id="generate-qrcode-btn" onclick="generateQRCode()">Gerar QR Code</button>
        </div>
    </main>
    <script src="./src/js/script.js"></script>
</body>
</html>
